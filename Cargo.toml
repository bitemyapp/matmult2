[package]
name = "matmult2"
version = "0.1.0"
edition = "2024"

[dependencies]
approx = "0.5.1"
crossbeam = "0.8.5"
divan = "0.1.21"
gemm = { version = "0.19", default-features = false, features = ["std", "rayon", "x86-v4"] }
rand = "0.10.3"
rayon = "1.11"

[profile.bench]
#debug = true # enable for samply runs

[[bench]]
name = "bench_mult"
harness = false

[profile.samply]
inherits = "release"
debug = true
